<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* capa do produto na Hotmart (600x600): duas fotos reais do protótipo + título */
  html, body { margin: 0; width: 600px; height: 600px; overflow: hidden; background: #8EBFD2; font-family: 'Nunito', sans-serif; }
  .foto { position: absolute; top: 150px; width: 282px; height: 400px; border: 4px solid #152033; border-radius: 22px; background-size: 1080px 1920px; overflow: hidden; }
  .a { left: 14px; background-image: url(decorazione-foto-notte.png); background-position: -380px -760px; transform: rotate(-2deg); }
  .b { right: 14px; background-image: url(decorazione-foto-regalo.png); background-position: -380px -700px; transform: rotate(2deg); }
  .foto span { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap; background: #FFC93C; border: 3px solid #152033; border-radius: 99px; padding: 3px 12px; font-weight: 900; font-size: 18px; color: #152033; }
  .b span { background: #FFB3D1; }
  h1 { position: absolute; top: 18px; left: 0; right: 0; margin: 0; text-align: center; font-weight: 900; font-size: 50px; line-height: 1.05; color: #fff; -webkit-text-stroke: 10px #152033; paint-order: stroke fill; }
  h1 b { color: #FFC93C; }
  .piede { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 19px; color: #152033; }
</style>
</head>
<body>
<h1>La tua casa<br><b>speciale ✨</b></h1>
<div class="foto a"><span>⚽ la tua squadra</span></div>
<div class="foto b"><span>🎁 regala a un amico</span></div>
<div class="piede">Italia Casa per Casa · solo estetica, niente punti</div>
</body>
</html>
