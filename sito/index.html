<!-- import maps só existem no Safari 16.4+: em iPhone mais antigo o polyfill carrega os módulos (nos outros não faz nada) -->
<script async src="vendor/es-module-shims.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script>
  // se a mapa não carrega: avisa a pessoa (em vez de girar para sempre) e manda o erro para api/errore.php
  (function () {
    window.__t0 = Date.now(); window.__fase = 'html';
    var enviados = 0;
    function relata(msg) {
      if (enviados++ > 3 || !navigator.sendBeacon) return;
      try { navigator.sendBeacon('api/errore.php', JSON.stringify({ msg: String(msg).slice(0, 300), ua: navigator.userAgent, url: location.href })); } catch (e) {}
    }
    window.__relata = relata;
    // contador anônimo (sem cookies): uma visita por carregamento; main.js manda 'ok' quando a mapa abre
    // ?da=bio (link da bio), ?da=gioco (botões de compartilhar)...: conta o canal e tira as etiquetas do endereço
    var da = '';
    try {
      var u = new URL(location.href);
      da = (u.searchParams.get('da') || '').toLowerCase().slice(0, 20);
      var sujo = false;
      ['da', 'fbclid', 'igshid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (k) { if (u.searchParams.has(k)) { u.searchParams.delete(k); sujo = true; } });
      if (sujo) history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (e) {}
    window.__conta = function (t) { try { navigator.sendBeacon && navigator.sendBeacon('api/visita.php', JSON.stringify({ t: t, p: 'mappa', ref: document.referrer, da: da })); } catch (e) {} };
    window.__conta('v');
    window.addEventListener('error', function (e) {
      // ruído do navegador do app do Instagram (scripts dele, iabjs://) e erros opacos: não são nossos
      if (/^iabjs:/.test(e.filename || '') || e.message === 'Script error.') return;
      relata((e.message || 'erro') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
    window.addEventListener('unhandledrejection', function (e) { relata('promise: ' + (e.reason && (e.reason.message || e.reason))); });
    setTimeout(function () {
      var c = document.getElementById('caricamento');
      if (!c || c.classList.contains('fora') || window.__fase === 'pronto') return;   // pronto = esperando o "Entra"
      // fase em que parou + o que já baixou + tipo de rede: separa "lento" de "travado"
      var net = navigator.connection ? ' rete=' + navigator.connection.effectiveType : '';
      window.__lento = true;
      relata('timeout 25 s · fase=' + window.__fase + ' · scaricati=' + Object.keys(window.__fasi || {}).join(',') + net);
      var p = c.querySelector('p');
      if (p) p.innerHTML = 'Ci sta mettendo più del solito… 🐢<br><small>Se sei dentro Instagram, tocca ⋯ in alto e scegli «Apri nel browser».</small>';
    }, 25000);
  })();
</script>

<!-- abertura: as casinhas sobem conforme carrega; no fim "Entra" (o toque liga a música: js/intro.js + js/musica.js) -->
<div id="caricamento">
  <div class="ap-sole"></div><div class="ap-nuvola n1"></div><div class="ap-nuvola n2"></div>
  <div class="ap-logo"><span class="ap-it">Italia</span><span class="ap-cpc">Casa per Casa</span><span class="ap-tri"><i></i><i></i><i></i></span></div>
  <div class="ap-case"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="ap-barra"><b id="intro-barra"></b></div>
  <p id="intro-msg">Costruendo l'Italia…</p>
  <div id="intro-dati" hidden></div>
  <button id="intro-entra" type="button" hidden>▶ Entra</button>
  <button id="intro-audio" type="button" hidden></button>
</div>
<script>
  // progresso da abertura: segue window.__fase (main.js) e window.__fasi (dati.js); frases mudam sozinhas
  (function () {
    var frasi = ['Impastando la pizza…', 'Aprendo le persiane…', 'Stendendo i panni al sole…', 'Accendendo i lampioni…',
      'Suonando le campane…', 'Preparando il caffè…', 'Spazzando la piazza…', 'Costruendo casa per casa…'];
    var P = { html: 0.06, modulo: 0.16, dati: 0.74, mappa: 0.88, pronto: 1 };
    var barra = document.getElementById('intro-barra'), msg = document.getElementById('intro-msg');
    var casas = [].slice.call(document.querySelectorAll('.ap-case i')), visto = 0, k = 0, parou = false;
    function alvo() {
      var f = window.__fase, a = P[f] || 0.06;
      if (f === 'modulo') a += Object.keys(window.__fasi || {}).length * 0.11;   // geo, comuni, snapshot, rilievo, terreno
      return Math.min(a, 1);
    }
    var t = setInterval(function () {
      if (parou) return clearInterval(t);
      var a = alvo();
      visto += (a - visto) * 0.12;
      if (a < 1 && visto > a - 0.02) visto = Math.min(visto + 0.0012, a + 0.07);   // nunca parece parado
      barra.style.width = (visto * 100).toFixed(1) + '%';
      var n = Math.min(casas.length, Math.floor(visto * casas.length + 0.4));
      for (var i = 0; i < n; i++) casas[i].className = 'su';
    }, 50);
    var tf = setInterval(function () {
      if (parou || window.__fase === 'pronto') return clearInterval(tf);
      if (!window.__lento) msg.textContent = frasi[k++ % frasi.length];
    }, 1500);
    window.__intro = {
      pronto: function (dati) {
        visto = 1; barra.style.width = '100%';
        casas.forEach(function (c) { c.className = 'su'; });
        setTimeout(function () {
          parou = true;
          document.getElementById('caricamento').classList.add('pronto');
          msg.textContent = 'Benvenuti in Italia!';
          var d = document.getElementById('intro-dati'); d.textContent = dati; d.hidden = false;
          document.getElementById('intro-entra').hidden = false;
          document.getElementById('intro-audio').hidden = false;
          document.getElementById('intro-entra').focus({ preventScroll: true });
        }, 350);
      },
      fim: function () { parou = true; },
    };
  })();
</script>
<script type="module" src="js/main.js"></script>
