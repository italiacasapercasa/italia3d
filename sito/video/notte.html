<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<base href="../">
<title>Registra reel notte · Italia Casa per Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<style>
  :root { --ink: #152033; --giallo: #FFC93C; --rosso: #E0473C; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #8EBFD2; font-family: 'Nunito', sans-serif; }
  #mappa { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  .forte { color: #fff; font-weight: 900; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-transform: uppercase; letter-spacing: 1px; }
  .forte .g { color: var(--giallo); }
  #testa { position: absolute; top: 120px; left: 0; right: 0; text-align: center; }
  #titolo { font-size: 128px; line-height: 1; }
  #sotto-titolo { margin-top: 16px; font-size: 58px; line-height: 1; -webkit-text-stroke-width: 12px; }
  #sott { position: absolute; left: 40px; right: 40px; top: 1300px; text-align: center; font-size: 84px; line-height: 1.12; }
  #banner { position: absolute; top: 1120px; left: 0; right: 0; text-align: center; font-size: 52px; -webkit-text-stroke-width: 12px; opacity: 0; }
  .balao { position: absolute; left: 110px; width: 860px; top: 560px; background: #fff; border: 5px solid var(--ink); border-radius: 30px; padding: 22px 26px; display: flex; align-items: center; gap: 22px; box-shadow: 0 8px 0 rgba(21,32,51,.25); opacity: 0; box-sizing: border-box; }
  .balao img { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--ink); }
  .balao .corpo { flex: 1; min-width: 0; }
  .balao .chi { font-size: 28px; font-weight: 900; color: var(--ink); }
  .balao .chi span { color: #8A93A3; font-weight: 700; }
  .balao .testo { font-size: 40px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .balao .testo .at { color: #2F7DD1; }
  .balao .cursore { display: inline-block; width: 4px; height: 40px; background: var(--rosso); vertical-align: -6px; margin-left: 3px; }
  .chip { position: absolute; left: 50%; top: 760px; font-size: 120px; -webkit-text-stroke-width: 22px; transform: translateX(-50%) scale(0); }
  .etichetta { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transform-origin: 50% 100%; }
  .etichetta .esempio { background: #4A5568; color: #fff; font-weight: 900; font-size: 22px; letter-spacing: 2px; padding: 4px 14px; border-radius: 8px; border: 3px solid var(--ink); }
  .etichetta .pillola { background: #fff; border: 5px solid var(--ink); border-radius: 26px; padding: 10px 26px; text-align: center; }
  .etichetta .pillola b { display: block; font-size: 38px; font-weight: 900; color: var(--ink); line-height: 1.1; white-space: nowrap; }
  .etichetta .pillola small { display: block; font-size: 24px; font-weight: 800; color: #5B6475; }
  .etichetta.vero .pillola { background: var(--giallo); }
  .etichetta .freccia { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 14px solid var(--ink); }
  #carta { position: absolute; left: 90px; right: 90px; top: 540px; background: #fff; border: 6px solid var(--ink); border-radius: 36px; padding: 28px 32px; box-shadow: 0 10px 0 rgba(21,32,51,.25); opacity: 0; box-sizing: border-box; }
  #carta .tag { display: inline-block; border: 4px solid var(--ink); border-radius: 99px; padding: 4px 16px; font-size: 26px; font-weight: 800; }
  #carta .esempio { float: right; background: #4A5568; color: #fff; font-weight: 900; font-size: 22px; letter-spacing: 2px; padding: 4px 14px; border-radius: 8px; border: 3px solid var(--ink); }
  #carta h2 { margin: 14px 0 0; font-size: 58px; font-weight: 900; color: var(--ink); }
  #carta .sub { font-size: 28px; font-weight: 800; color: #5B6475; }
  #carta p { font-size: 30px; font-weight: 700; color: var(--ink); margin: 14px 0; }
  #carta .wa { display: inline-block; background: #25D366; color: #fff; border: 5px solid var(--ink); border-radius: 99px; padding: 14px 30px; font-size: 36px; font-weight: 900; }
  #tocco { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 10px solid #fff; box-shadow: 0 0 0 6px var(--ink); opacity: 0; }
  .riquadro { position: absolute; left: 90px; right: 90px; top: 560px; background: #fff; border: 6px solid var(--ink); border-radius: 36px; padding: 26px 32px; box-shadow: 0 10px 0 rgba(21,32,51,.25); opacity: 0; box-sizing: border-box; text-align: center; }
  #buio b { display: block; font-size: 96px; font-weight: 900; color: var(--ink); line-height: 1; }
  #buio small { display: block; font-size: 34px; font-weight: 800; color: #5B6475; margin-top: 8px; }
  #regioni h2 { margin: 0 0 10px; font-size: 40px; font-weight: 900; color: var(--ink); }
  #regioni .riga { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-top: 3px dashed #D9DDE3; opacity: 0; text-align: left; }
  #regioni .pos { width: 60px; height: 60px; border-radius: 50%; border: 5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; background: var(--giallo); flex: none; }
  #regioni .nome { flex: 1; font-size: 42px; font-weight: 900; color: var(--ink); }
  #regioni .barra { height: 14px; background: #EEF1F5; border-radius: 8px; margin-top: 6px; overflow: hidden; }
  #regioni .barra i { display: block; height: 100%; width: 0; background: #FFB437; border-radius: 8px; }
  #regioni .num { font-size: 38px; font-weight: 900; color: var(--ink); }
</style>
</head>
<body>
<canvas id="mappa"></canvas>
<div id="etichette"></div>
<div id="testa" class="forte"><div id="sotto-titolo" style="font-size:58px;margin:0 0 6px"></div><div id="titolo"></div><div id="luci" style="margin-top:18px;font-size:60px;-webkit-text-stroke-width:13px;opacity:0"></div></div>
<div id="commento" class="balao"><img src="img/logo.png" alt=""><div class="corpo"><div class="chi"></div><div class="testo"></div></div></div>
<div id="buio" class="riquadro"><b></b><small></small></div>
<div id="regioni" class="riquadro"><h2>✨ LE REGIONI PIÙ ACCESE</h2></div>
<div id="banner" class="forte"></div>
<div id="sott" class="forte"></div>
<script type="module" src="video/notte.js"></script>
</body>
</html>
