<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<base href="../">
<title>Registra reel con dati reali · Italia Casa per Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<style>
  :root { --ink: #152033; --giallo: #FFC93C; --rosso: #E0473C; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #8EBFD2; font-family: 'Nunito', sans-serif; }
  #mappa { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  .forte { color: #fff; font-weight: 900; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-transform: uppercase; letter-spacing: 1px; }
  .forte .g { color: var(--giallo); }
  #testa { position: absolute; top: 120px; left: 0; right: 0; text-align: center; }
  #titolo { font-size: 128px; line-height: 1; }
  #contatore { margin-top: 18px; font-size: 64px; line-height: 1; -webkit-text-stroke-width: 13px; }
  #sott { position: absolute; left: 40px; right: 40px; top: 1300px; text-align: center; font-size: 84px; line-height: 1.12; }
  #banner { position: absolute; top: 560px; left: 0; right: 0; text-align: center; font-size: 46px; -webkit-text-stroke-width: 11px; opacity: 0; }
  .carta { position: absolute; left: 90px; right: 90px; background: #fff; border: 6px solid var(--ink); border-radius: 36px; box-shadow: 0 10px 0 rgba(21,32,51,.25); opacity: 0; transform-origin: 50% 0; box-sizing: border-box; }
  #card { top: 520px; padding: 26px 30px; text-align: center; }
  #card .sopra { font-size: 34px; font-weight: 900; color: #5B6475; letter-spacing: 1px; }
  #card .grande { font-size: 66px; font-weight: 900; color: var(--ink); line-height: 1.05; margin: 8px 0; }
  #card .sotto { display: inline-block; background: var(--giallo); border: 4px solid var(--ink); border-radius: 16px; padding: 6px 20px; font-size: 38px; font-weight: 900; color: var(--ink); }
  #classifica { top: 500px; padding: 24px 28px; }
  #classifica h2 { margin: 0 0 12px; font-size: 40px; font-weight: 900; color: var(--ink); text-align: center; }
  #classifica .riga { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-top: 3px dashed #D9DDE3; opacity: 0; }
  #classifica .pos { width: 64px; height: 64px; border-radius: 50%; border: 5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: var(--ink); background: var(--giallo); flex: none; }
  #classifica .riga:nth-of-type(3) .pos { background: #E4E7EC; }
  #classifica .riga:nth-of-type(4) .pos { background: #F2C98A; }
  #classifica .quem { flex: 1; min-width: 0; }
  #classifica .quem b { display: block; font-size: 40px; font-weight: 900; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #classifica .quem small { display: block; font-size: 26px; font-weight: 800; color: #5B6475; }
  #classifica .barra { height: 14px; background: #EEF1F5; border-radius: 8px; margin-top: 6px; overflow: hidden; }
  #classifica .barra i { display: block; height: 100%; width: 0; background: var(--rosso); border-radius: 8px; }
  #classifica .pts { font-size: 40px; font-weight: 900; color: var(--ink); flex: none; }
  .balao { position: absolute; left: 120px; width: 840px; top: 560px; background: #fff; border: 5px solid var(--ink); border-radius: 30px; padding: 22px 26px; display: flex; align-items: center; gap: 22px; box-shadow: 0 8px 0 rgba(21,32,51,.25); transform-origin: 50% 0; opacity: 0; box-sizing: border-box; }
  .balao img { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--ink); }
  .balao .corpo { flex: 1; min-width: 0; }
  .balao .chi { font-size: 28px; font-weight: 900; color: var(--ink); }
  .balao .chi span { color: #8A93A3; font-weight: 700; }
  .balao .testo { font-size: 40px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .balao .testo .at { color: #2F7DD1; }
  .balao .cursore { display: inline-block; width: 4px; height: 40px; background: var(--rosso); vertical-align: -6px; margin-left: 3px; }
  .chip { position: absolute; left: 50%; top: 760px; font-size: 120px; -webkit-text-stroke-width: 22px; transform: translateX(-50%) scale(0); }
  .etichetta { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transform-origin: 50% 100%; }
  .etichetta .esempio { background: #4A5568; color: #fff; font-weight: 900; font-size: 22px; letter-spacing: 2px; padding: 4px 14px; border-radius: 8px; border: 3px solid var(--ink); }
  .etichetta .pillola { background: #fff; border: 5px solid var(--ink); border-radius: 26px; padding: 10px 26px; text-align: center; }
  .etichetta .pillola b { display: block; font-size: 40px; font-weight: 900; color: var(--ink); line-height: 1.1; }
  .etichetta .pillola small { display: block; font-size: 24px; font-weight: 800; color: #5B6475; }
  .etichetta.carica .pillola { background: var(--giallo); }
  .etichetta .freccia { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 14px solid var(--ink); }
</style>
</head>
<body>
<canvas id="mappa"></canvas>
<div id="etichette"></div>
<div id="testa" class="forte"><div id="titolo"></div><div id="contatore"></div></div>
<div id="card" class="carta"><div class="sopra"></div><div class="grande"></div><div class="sotto"></div></div>
<div id="classifica" class="carta"><h2>🏆 CLASSIFICA DELLA SETTIMANA</h2></div>
<div id="commento" class="balao"><img src="img/logo.png" alt=""><div class="corpo"><div class="chi"></div><div class="testo"></div></div></div>
<div id="tag" class="balao"><img src="img/logo.png" alt=""><div class="corpo"><div class="chi"></div><div class="testo"></div></div></div>
<div id="piu5" class="chip forte"><span class="g">+5</span></div>
<div id="piu3" class="chip forte"><span class="g">+3</span></div>
<div id="piu20" class="chip forte"><span class="g">+20</span> 🔥</div>
<div id="banner" class="forte"></div>
<div id="sott" class="forte"></div>
<script type="module" src="video/presidente.js"></script>
</body>
</html>
