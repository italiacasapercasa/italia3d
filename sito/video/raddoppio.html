<style>

  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #8EBFD2; font-family: 'Nunito', sans-serif; }
  #mappa { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #velo { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .forte { color: #fff; font-weight: 900; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-transform: uppercase; letter-spacing: 1px; }
  .forte .g, .g { color: var(--giallo); }
  .forte .r, .r { color: var(--rosa); }
  .forte .ro { color: #FF5A4E; }
  .forte .v { color: #7DFF8A; }
  #testa { position: absolute; top: 110px; left: 20px; right: 20px; text-align: center; }
  #righe { transform-origin: 50% 0; }
  #r1, #r2 { font-size: 84px; line-height: 1.03; -webkit-text-stroke-width: 15px; }
  #r1.grande, #r2.grande { font-size: 150px; -webkit-text-stroke-width: 26px; }
  #sott { position: absolute; left: 40px; right: 40px; top: 1330px; text-align: center; font-size: 92px; line-height: 1.1; }
  #etichette > div { position: absolute; left: 0; top: 0; opacity: 0; transform-origin: 50% 100%; }
  .cartello { display: flex; flex-direction: column; align-items: center; }
  .cartello .box { background: var(--giallo); border: 5px solid var(--ink); border-radius: 22px; padding: 10px 26px 12px; text-align: center; box-shadow: 0 6px 0 rgba(21,32,51,.25); white-space: nowrap; }
  .cartello .box.cornice { background: #fff; border-color: #C99A1E; box-shadow: 0 0 0 6px #F2C230, 0 8px 0 6px rgba(21,32,51,.25); }
  .cartello .box b { display: block; font-size: 46px; font-weight: 900; color: var(--ink); line-height: 1.05; }
  .cartello .box span { display: block; font-size: 30px; font-weight: 900; color: var(--ink); text-transform: uppercase; }
  .cartello .box small { display: block; font-size: 26px; font-weight: 800; color: #3B2A08; text-transform: uppercase; }
  .cartello .freccia { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 16px solid var(--ink); }
  .riquadro { position: absolute; left: 60px; right: 60px; top: 470px; background: #fff; border: 6px solid var(--ink); border-radius: 36px; padding: 26px 30px; box-shadow: 0 10px 0 rgba(21,32,51,.25); opacity: 0; box-sizing: border-box; transform-origin: 50% 0; }

  .chip { position: absolute; left: 50%; font-size: 70px; -webkit-text-stroke-width: 14px; transform: translateX(-50%) scale(0); white-space: nowrap; }
  #coriandoli i { position: absolute; left: 0; top: 0; width: 22px; height: 34px; border-radius: 4px; opacity: 0; }
  /* 1 milhão */

  #views .n { font-size: 172px; -webkit-text-stroke-width: 30px; line-height: 1; font-variant-numeric: tabular-nums; }

  /* as 8 casas decoradas */

  #otto h2 { font-size: 52px; }
  #otto h2 .da { display: inline-block; min-width: 70px; }
  #otto .slot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; margin-top: 14px; }
  #otto .s { text-align: center; opacity: 0; position: relative; }

  /* pedidos */
  #richieste > div { position: absolute; max-width: 640px; background: #fff; border: 5px solid var(--ink); border-radius: 30px 30px 30px 8px; padding: 16px 24px; font-size: 40px; font-weight: 900; color: var(--ink); box-shadow: 0 8px 0 rgba(21,32,51,.25); opacity: 0; white-space: nowrap; }
  #richieste > div.dx { border-radius: 30px 30px 8px 30px; background: #DCF8C6; }

  /* vagas */

  #posti .box .nuovo { background: var(--giallo); border-style: solid; }
  #posti .riga2 { display: flex; justify-content: center; gap: 22px; margin-top: 22px; }
  #posti .riga2 div { font-size: 34px; font-weight: 900; color: var(--ink); background: #F3F5F8; border: 4px solid var(--ink); border-radius: 18px; padding: 8px 18px; opacity: 0; }
  #posti .riga2 b { color: var(--rosso); }
  #stamp-x2 { position: absolute; left: 0; right: 0; top: 1040px; text-align: center; font-size: 104px; -webkit-text-stroke-width: 20px; opacity: 0; line-height: 1.02; }
  /* jogos */

  #giochi .pad { font-size: 230px; line-height: 1; opacity: 0; display: inline-block; }
  #giochi .t1 { font-size: 92px; -webkit-text-stroke-width: 17px; opacity: 0; }

  #giochi .mini { position: absolute; font-size: 90px; opacity: 0; }
  #presto { position: absolute; top: 300px; right: 70px; font-size: 64px; -webkit-text-stroke-width: 13px; background: none; opacity: 0; }
  #punti i { position: absolute; left: 0; top: 0; font-style: normal; font-size: 64px; -webkit-text-stroke-width: 13px; opacity: 0; white-space: nowrap; }
  /* contagem */
  #conto { top: 520px; text-align: center; }
  #conto .quando { font-size: 40px; font-weight: 900; color: var(--ink); margin-top: 8px; }
  #conto .cifre { display: flex; justify-content: center; gap: 18px; margin-top: 18px; }
  #conto .cifre div { background: var(--giallo); border: 5px solid var(--ink); border-radius: 22px; width: 190px; padding: 8px 0; }
  #conto .cifre b { display: block; font-size: 84px; font-weight: 900; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
  #conto .cifre small { font-size: 26px; font-weight: 900; color: #5B6475; }
  #cta { position: absolute; left: 20px; right: 20px; top: 520px; text-align: center; }
  #cta > div { opacity: 0; transform-origin: 50% 50%; }
  #cta .a1 { font-size: 80px; -webkit-text-stroke-width: 15px; }
  #cta .b { font-size: 70px; -webkit-text-stroke-width: 14px; margin-top: 16px; }
  #cta .d { font-size: 54px; -webkit-text-stroke-width: 12px; margin-top: 40px; }
  .lampo { box-shadow: 0 0 0 10px var(--giallo) !important; }
</style>
