<!doctype html>

<title>Registra reel fondatori · Italia Casa per Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<style>
  :root { --ink: #152033; --giallo: #FFC93C; --rosso: #E0473C; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #8EBFD2; font-family: 'Nunito', sans-serif; }
  #mappa { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  .forte { color: #fff; font-weight: 900; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-transform: uppercase; letter-spacing: 1px; }
  .forte .g, .g { color: var(--giallo); }
  #testa { position: absolute; top: 110px; left: 20px; right: 20px; text-align: center; }
  #icona { font-size: 62px; line-height: 1; -webkit-text-stroke-width: 12px; }
  #righe { margin-top: 14px; transform-origin: 50% 0; }
  #r1 { font-size: 84px; line-height: 1.02; -webkit-text-stroke-width: 15px; }
  #r2 { font-size: 84px; line-height: 1.02; -webkit-text-stroke-width: 15px; }
  #r1.grande { font-size: 132px; -webkit-text-stroke-width: 22px; }
  #sott { position: absolute; left: 40px; right: 40px; top: 1290px; text-align: center; font-size: 92px; line-height: 1.1; }
  #cta { position: absolute; left: 20px; right: 20px; top: 560px; text-align: center; }
  #cta > div { opacity: 0; transform-origin: 50% 50%; }
  #cta .a { font-size: 84px; -webkit-text-stroke-width: 15px; }
  #cta .b { font-size: 64px; -webkit-text-stroke-width: 13px; margin-top: 10px; }
  #cta .c { font-size: 50px; -webkit-text-stroke-width: 11px; margin-top: 14px; }
  .etichetta { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; transform-origin: 50% 100%; }
  .fumetto { align-self: flex-start; margin-left: -60px; background: #fff; border: 5px solid var(--ink); border-radius: 22px; padding: 8px 22px 10px; box-shadow: 0 6px 0 rgba(21,32,51,.25); }
  .fumetto small { display: block; font-size: 22px; font-weight: 800; color: #8A93A3; }
  .fumetto b { display: block; font-size: 38px; font-weight: 900; color: var(--ink); white-space: nowrap; }
  .card { position: relative; background: #fff; border: 5px solid var(--ink); border-radius: 24px; padding: 10px 28px 12px; text-align: center; box-shadow: 0 6px 0 rgba(21,32,51,.25); }
  .card b { display: block; font-size: 40px; font-weight: 900; color: var(--ink); line-height: 1.1; white-space: nowrap; }
  .card small { display: block; font-size: 25px; font-weight: 800; color: #5B6475; line-height: 1.25; white-space: nowrap; }
  .card.oro { background: var(--giallo); }
  .card.oro small { color: #4B3A10; }
  .badge { position: absolute; right: -40px; top: -54px; background: var(--rosso); color: #fff; font-size: 34px; font-weight: 900; padding: 4px 16px; border-radius: 12px; border: 4px solid #fff; box-shadow: 0 0 0 4px var(--ink); white-space: nowrap; transform: rotate(8deg) scale(0); }
  .freccia { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 16px solid var(--ink); }
</style>
</head>
<body>
<canvas id="mappa"></canvas>
<div id="etichette"></div>
<div id="testa" class="forte"><div id="icona">👤 = 🏠</div><div id="righe"><div id="r1"></div><div id="r2"></div></div></div>
<div id="cta" class="forte"><div class="a">👤+ SEGUI</div><div class="b">📍 COMMENTA LA TUA CITTÀ</div><div class="c g">PRIMA CHE QUALCUNO ARRIVI PRIMA</div></div>
<div id="sott" class="forte"></div>
<script type="module" src="video/fondatori.js"></script>
</body>
</html>
